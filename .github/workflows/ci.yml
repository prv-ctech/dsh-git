name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only checks out and reads. Nothing here needs a write scope, and a pull
# request build is where that matters most.
permissions:
  contents: read

jobs:
  # The gates themselves live in checks.yml, because Release runs the same ones
  # on the tagged commit.
  checks:
    uses: ./.github/workflows/checks.yml
