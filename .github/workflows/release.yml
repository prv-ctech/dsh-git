name: Release

# A version tag publishes two releases:
#
#   v<version>  the pinned release, its tarball named after the version
#   latest      a moving tag force-updated to the same commit, carrying the
#               stable asset name dsh-git.tgz so that
#               .../releases/latest/download/dsh-git.tgz always answers
#
# Installers can therefore pin (github:prv-ctech/dsh-git#v0.1.0) or track
# (github:prv-ctech/dsh-git#latest) without changing the command later.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The latest tag is moved with real Git history behind it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check:pack
      - name: The tag must name the packaged version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm pack
      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          cp "dsh-git-$version.tgz" dsh-git.tgz
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            "dsh-git-$version.tgz" dsh-git.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes --latest=false
      - name: Move the latest tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreated rather than updated, so it carries exactly one asset and
          # never accumulates older tarballs.
          gh release delete latest --yes || true
          gh release create latest dsh-git.tgz --verify-tag \
            --title latest --latest=true \
            --notes "Rolling release: the newest tagged version, currently $GITHUB_REF_NAME. Install with: dsh plugin --profile web add github:$GITHUB_REPOSITORY#latest — or download https://github.com/$GITHUB_REPOSITORY/releases/latest/download/dsh-git.tgz"
