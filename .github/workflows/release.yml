name: Release

# A version tag publishes one release: the tag names it, and the tarball is named
# after the version. Installers pin that tag —
#   dsh plugin --profile web add github:prv-ctech/dsh-git#v0.1.0
# — so what a profile runs is always a version someone named, never a moving
# target. GitHub marks the newest release as Latest on its own.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check:pack
      - name: The tag must name the packaged version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm pack
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            "dsh-git-$version.tgz" \
            --title "$GITHUB_REF_NAME" --generate-notes
